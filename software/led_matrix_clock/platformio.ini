; LED 矩阵时钟固件 —— PlatformIO 工程配置
; 目标：ESP8266（ESP-12E/F），Arduino 框架；主机侧单元测试用 native 环境

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
; 库版本锁定（设计文档 §15）
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17

; 主机侧单元测试：只编译纯逻辑模块（调度器、配置序列化），不含硬件相关文件
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<app/scheduler.cpp>
    +<config/config_schema.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
