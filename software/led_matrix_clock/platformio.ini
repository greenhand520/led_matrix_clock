; LED 矩阵时钟固件 —— PlatformIO 工程配置
; 目标：ESP8266（ESP-12E/F），Arduino 框架；主机侧单元测试用 native 环境
; 环境：
;   esp12e          —— 产品固件（src/main.cpp）
;   esp12e_fonttest —— 显示字模/像素验收固件（src/apps/font_test_main.cpp）
;   native          —— 主机侧单元测试（纯逻辑模块）

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<apps/>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17

; 显示验收固件：全字形/颜色/方向/亮度巡回检视
[env:esp12e_fonttest]
platform = espressif8266
board = esp12e
framework = arduino
monitor_speed = 115200
build_src_filter = +<*> -<main.cpp>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
    tzapu/WiFiManager@^2.0.17

; 主机侧单元测试：只编译纯逻辑模块（调度器、配置序列化、帧缓冲/字模）
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter =
    +<app/scheduler.cpp>
    +<config/config_schema.cpp>
    +<display/framebuffer.cpp>
    +<display/font_data.cpp>
    +<display/glcdfont.c>
lib_deps =
    bblanchon/ArduinoJson@^7.0.4
